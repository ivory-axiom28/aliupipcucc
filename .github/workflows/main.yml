name: aliupipcucc

on:
  schedule:
    - cron: "40 * * * *"  #每小时执行一次
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装Chrome和ChromeDriver
        run: |
          sudo apt update
          sudo apt install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          # 自动检测Chrome版本并安装匹配的ChromeDriver
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
          echo "检测到Chrome版本: $CHROME_VERSION"
          DRIVER_VERSION=$(curl -sS "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_$CHROME_VERSION")
          echo "使用ChromeDriver版本: $DRIVER_VERSION"
          wget -O /tmp/chromedriver.zip "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip /tmp/chromedriver.zip -d /tmp/
          sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: 安装Python依赖
        run: |
          pip install -r requirements.txt

      - name: 运行提取脚本并更新阿里云DNS
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_DOMAIN_NAME: ${{ secrets.ALIYUN_DOMAIN_NAME }}
          ALIYUN_RR: ${{ secrets.ALIYUN_RR }}
        run: python aliupipcucc.py

      - name: 提交更改
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"
          git add aliupipctcc.txt
          git commit -m "自动更新联通IP ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "无更改"
          git push
